apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devops-test
  namespace: orange
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - pods
  verbs:
  - get
  - list
  - create
  - delete
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - create
  - delete
