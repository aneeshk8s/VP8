apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mango
spec:
  maxReplicas: 10
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 80
        type: Utilization
    type: Resource
  minReplicas: 3
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mango
status:
  currentMetrics: null
  desiredReplicas: 0
