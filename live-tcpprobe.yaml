apiVersion: apps/v1
kind: Deployment
metadata:
  name: livetcp
#  namespace: devops
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mango
  template:
    metadata:
      labels:
        app: mango
    spec:
      containers:
      - image: nginx:latest
        name: con1
        ports:
        - containerPort: 80
        livenessProbe:
           tcpSocket:
             port: 8090
           initialDelaySeconds: 5
           periodSeconds: 5 
---
apiVersion: v1
kind: Service
metadata:
  name: livetcp-svc
spec:
  selector:
    app: mango
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mango-route
spec:
  port:
    targetPort: 80
  to:
    kind: ""
    name: mango-svc
    weight: null

