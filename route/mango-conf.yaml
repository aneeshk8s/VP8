apiVersion: v1
kind: ConfigMap
metadata:
  name: mango-conf
data:
  nginx.conf: |+
    events {}

    http {
        server {
            listen 8443 ssl;
            server_name tlsapp.apps-crc.testing;

            ssl_certificate     /etc/nginx/ssl/tls.crt;
            ssl_certificate_key /etc/nginx/ssl/tls.key;


            location / {
                root /usr/share/nginx/html;
                index index.html;
            }
        }
    }

